<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Weather Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/index.global.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.8/index.global.min.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">

    <!-- PNG icon (fallback or high-res) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">

    <!-- Apple Touch icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

    <!-- Manifest (if applicable) -->
    <link rel="manifest" href="/favicon/site.webmanifest">
    
    <style>
      body { font-family: sans-serif; margin: 40px; }
      #calendar { max-width: 900px; margin: auto; }
      @media (max-width:768px){

      .modal-dialog-bottom {
        margin: 0;
        position: fixed;
        bottom: 0;
        width: 100%;
      }

      .modal-content {
        border-radius: 20px 20px 0 0;
      }
      }
    </style>
  </head>
  <a href="http://192.168.1.160:49160">
    <img src="/misc/android-chrome-512x512.png" style="max-width: 50px; margin: 2em 0em 0em 2em;" alt="Home" class="home-icon">
</a>
  <body  data-bs-theme="dark">
    <div id="calendar"  data-bs-theme="dark"></div>
    <script type="module" src="/main.js"></script>
    <div class="modal fade" id="entryModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              Add Calendar Entry
            </h5>
          
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"></button>
          </div>
          
          <div class="modal-body">
          
            <div class="mb-3">
              <strong>Date:</strong>
              <span id="selectedDateLabel"></span>
            </div>
          
            <label class="form-label">
              Entry Type
            </label>
          
            <select id="entryType"
                    class="form-select mb-3">
          
              <option value="note">Note</option>
              <option value="greenhouse_min">
                Greenhouse Min
              </option>
          
            </select>
          
            <div id="noteField">
              <label class="form-label">Note</label>
              <textarea id="noteInput"
                        class="form-control"></textarea>
            </div>
          
            <div id="greenhouseField"
                 style="display:none;">
          
              <label class="form-label">
                Minimum Temperature
              </label>
          
              <input
                type="number"
                id="greenhouseInput"
                class="form-control"
              />
            </div>
          
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              id="saveEntryBtn"
            >
              Save
            </button>
          </div>
    
        </div>
      </div>
    </div>
  </body>
</html>
